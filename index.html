async function saveAdminSettings() {
  const titleEls = document.querySelectorAll('[data-notice-title]');
  const notices = Array.from(titleEls).map((el) => {
    const i = el.getAttribute('data-notice-title');
    const bodyEl = document.querySelector(`[data-notice-body="${i}"]`);
    const impEl = document.querySelector(`[data-notice-important="${i}"]`);
    return { title: el.value.trim(), body: bodyEl ? bodyEl.value.trim() : '', important: !!(impEl && impEl.checked) };
  });
  RETREAT_DATA.notices = notices;

  document.querySelectorAll('[data-link-url]').forEach((el) => {
    const key = el.getAttribute('data-link-url');
    if (RETREAT_DATA.links[key]) RETREAT_DATA.links[key].url = el.value.trim();
  });

  RETREAT_DATA.meta.theme = (document.getElementById('adminTheme').value || '').trim();
  RETREAT_DATA.meta.welcome = document.getElementById('adminWelcome').value;
  RETREAT_DATA.meta.dateStart = (document.getElementById('adminDateStart').value || '').trim();
  RETREAT_DATA.meta.dateLabel = (document.getElementById('adminDateLabel').value || '').trim();
  const prevTeamCount = RETREAT_DATA.missions.gbsTeamCount;
  const teamCount = parseInt(document.getElementById('adminTeamCount').value, 10);
  if (teamCount >= 1 && teamCount <= 40) RETREAT_DATA.missions.gbsTeamCount = teamCount;
  if (RETREAT_DATA.missions.gbsTeamCount !== prevTeamCount) refreshGbsSection();

  if (!isFirebaseConfigured() || !db || !firestoreModRef) {
    toast('Firebase 설정이 없어서 이 기기에만 반영돼요.');
    refreshAfterSettingsChange();
    closeAdminModal();
    return;
  }
  const { doc, setDoc } = firestoreModRef;
  const linksPlain = {};
  Object.keys(RETREAT_DATA.links).forEach((k) => { linksPlain[k] = { url: RETREAT_DATA.links[k].url || '' }; });
  try {
    await setDoc(doc(db, 'settings', 'content'), {
      notices: RETREAT_DATA.notices,
      links: linksPlain,
      welcome: RETREAT_DATA.meta.welcome,
      theme: RETREAT_DATA.meta.theme,
      dateStart: RETREAT_DATA.meta.dateStart,
      dateLabel: RETREAT_DATA.meta.dateLabel,
      gbsTeamCount: RETREAT_DATA.missions.gbsTeamCount,
    }, { merge: true });
    toast('저장했어요! 모두의 화면에 반영됩니다 🎉');
    refreshAfterSettingsChange();
    closeAdminModal();
  } catch (err) {
    console.error('admin save failed', err);
    toast('저장에 실패했어요. Firestore 규칙에 settings 컬렉션이 있는지 확인해주세요.');
  }
}
function refreshAfterSettingsChange() {
  renderTopbar();
  const homePanel = document.getElementById('panel-home');
  if (homePanel) homePanel.innerHTML = renderHome();
  const detailBody = document.getElementById('detailBody');
  if (detailBody) {
    detailBody.innerHTML = renderDetailPanels();
    if (currentDetail) {
      const p = document.getElementById('detail-' + currentDetail);
      if (p) p.classList.add('active');
    }
  }
}
function watchSettings(firestoreMod) {
  const { doc, onSnapshot } = firestoreMod;
  onSnapshot(doc(db, 'settings', 'content'), (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    let changed = false;
    if (Array.isArray(data.notices)) { RETREAT_DATA.notices = data.notices; changed = true; }
    if (data.links && typeof data.links === 'object') {
      Object.keys(data.links).forEach((k) => { if (RETREAT_DATA.links[k]) Object.assign(RETREAT_DATA.links[k], data.links[k]); });
      changed = true;
    }
    if (typeof data.welcome === 'string') { RETREAT_DATA.meta.welcome = data.welcome; changed = true; }
    if (typeof data.theme === 'string') { RETREAT_DATA.meta.theme = data.theme; changed = true; }
    if (typeof data.dateStart === 'string' && data.dateStart) { RETREAT_DATA.meta.dateStart = data.dateStart; changed = true; }
    if (typeof data.dateLabel === 'string' && data.dateLabel) { RETREAT_DATA.meta.dateLabel = data.dateLabel; changed = true; }
    if (typeof data.gbsTeamCount === 'number' && data.gbsTeamCount !== RETREAT_DATA.missions.gbsTeamCount) {
      RETREAT_DATA.missions.gbsTeamCount = data.gbsTeamCount;
      refreshGbsSection();
      changed = true;
    }
    if (changed) refreshAfterSettingsChange();
  }, (err) => console.error('settings watch failed', err));
}

  const gbsUploadLabel = e.target.closest('.gbsphoto-upload-btn');

    if (sel) { sel.scrollIntoView({ behavior: 'smooth', block: 'center' }); sel.focus(); }

  }

  if (e.target.id === 'adminModalClose') { closeAdminModal(); return; }
  if (e.target.id === 'adminModal') { closeAdminModal(); return; }

    const val = document.getElementById('adminPinInput').value;
    if (val === ADMIN_PIN) {
      lsSet('gt_admin_unlocked', true);
      document.getElementById('adminGearBtn').classList.add('on');

      openAdminModal();
    } else {
      toast('PIN이 올바르지 않아요.');

  }

    lsSet('gt_admin_unlocked', false);
    document.getElementById('adminGearBtn').classList.remove('on');
    closeAdminModal();

    const scope = dayTab.closest('.tab-panel, .detail-panel');
    scope.querySelectorAll('.day-tab').forEach((t) => t.classList.remove('active'));

    scope.querySelectorAll('.day-panel').forEach((p) => p.classList.remove('active'));
    const dp = scope.querySelector(`[data-day-panel="${dayTab.getAttribute('data-day')}"]`);
    if (dp) dp.classList.add('active');
    return;
  }
  const roundTab = e.target.closest('.day-tab[data-round]');
  if (roundTab) {
    const scope = roundTab.closest('.tab-panel, .detail-panel');
    scope.querySelectorAll('.day-tab').forEach((t) => t.classList.remove('active'));
    roundTab.classList.add('active');
    scope.querySelectorAll('.day-panel').forEach((p) => p.classList.remove('active'));

    if (dp) dp.classList.add('active');

  const faqQ = e.target.closest('[data-faq-toggle]');
  if (faqQ) { faqQ.closest('.faq-item').classList.toggle('open'); return; }

  const packToggle = e.target.closest('[data-pack-toggle]');
  if (packToggle) {
    const key = packToggle.getAttribute('data-pack-toggle');
    const now = !lsGet(key, false);
    lsSet(key, now);
    packToggle.classList.toggle('checked', now);
    packToggle.innerHTML = now ? iconSvg('check') : '';
    const textEl = document.querySelector(`[data-pack-text="${key}"]`);

  const mcatToggle = e.target.closest('[data-mcat-toggle]');
  if (mcatToggle) { mcatToggle.closest('.mission-cat-item').classList.toggle('open'); return; }

  const missionToggle = e.target.closest('[data-mission-toggle]');
  if (missionToggle) {
    const key = missionToggle.getAttribute('data-mission-toggle');
    const now = !lsGet(key, false);
    lsSet(key, now);
    missionToggle.classList.toggle('done', now);
    const cb = missionToggle.querySelector('.mission-check');
    cb.classList.toggle('checked', now);
    cb.innerHTML = now ? iconSvg('check') : '';
    const stats = missionStats();
    const bar = document.querySelector('.mission-bar-fill');
    const label = document.querySelector('.mission-progress-top span');
    if (bar) bar.style.width = (stats.total ? Math.round((stats.done / stats.total) * 100) : 0) + '%';
    if (label) label.textContent = `${stats.done} / ${stats.total}`;
    const catId = key.split('_')[2];
    const cs = categoryStats(catId);
    const catItemEl = document.querySelector(`.mission-cat-item[data-mcat="${catId}"]`);
    if (catItemEl) {
      const countEl = catItemEl.querySelector('.mission-cat-count');
      if (countEl) countEl.textContent = `${cs.done}/${cs.total}`;
      catItemEl.classList.toggle('full', cs.total > 0 && cs.done === cs.total);
    }
    syncMissionProgress();
    return;
  }

  if (e.target.id === 'nicknameSave') {
    const input = document.getElementById('nicknameInput');
    const val = (input.value || '').trim().slice(0, 16);
    if (!val) { toast('닉네임을 입력해주세요.'); return; }
    setNickname(val);
    toast(`'${val}'(으)로 랭킹에 참여해요! 🎉`);
    syncMissionProgress();
    const panel = document.getElementById('panel-missions');
    if (panel) panel.innerHTML = renderMissions();
    updateGbsDynamic();
    return;
  }

  if (e.target.id === 'commitmentSave') {
    const val = document.getElementById('commitmentInput').value.trim();
    lsSet('gt_my_commitment', val);
    const saved = document.getElementById('commitmentSaved');
    saved.hidden = false;
    saved.textContent = val
      ? (isFirebaseConfigured() ? '저장됐어요. 모두의 화면에도 나눠졌어요 🌿' : '이 기기에 저장됐어요. (Firebase 설정 후엔 모두와 공유돼요)')
      : '다짐을 지웠어요.';
    toast(val ? '다짐을 나눴어요!' : '다짐을 지웠어요.');
    syncCommitment(val);
    return;
  }

  const thumb = e.target.closest('.photo-thumb, .gbsphoto-thumb');
  if (thumb) { openLightbox(thumb.getAttribute('data-url'), thumb.getAttribute('data-name')); return; }
});

/* ============================================================================
   GBS 단체 미션 — 조 선택과 파일 선택(change)은 이벤트 위임으로 처리합니다.
   (미션 탭이 다시 그려져도 delegation 덕분에 계속 정상 동작해요.)
============================================================================ */
document.addEventListener('change', async (e) => {
  if (e.target.id === 'myTeamSelect') {
    lsSet('gt_my_gbs_team', e.target.value);
    updateGbsDynamic();
    refreshHomePanel();
    if (e.target.value) toast(`${e.target.value}(으)로 설정했어요!`);
    return;
  }
  const fileInput = e.target.closest('[data-gbsphoto-file]');
  if (!fileInput) return;
  const missionId = fileInput.getAttribute('data-gbsphoto-file');
  const mission = gbsMissionList().find((m) => m.id === missionId);
  const files = Array.from(fileInput.files || []);
  if (!mission || !files.length) return;
  const team = myTeam();
  if (!team) { toast('먼저 우리 조를 선택해주세요 👆'); fileInput.value = ''; return; }
  if (!isFirebaseConfigured() || !db || !firestoreModRef) {
    toast('Firebase 설정 후 인증샷을 올릴 수 있어요.');
    fileInput.value = '';
    return;
  }
  const progressEl = document.getElementById('gbsphotoProgress_' + missionId);
  if (progressEl) progressEl.hidden = false;
  const { collection, addDoc, serverTimestamp } = firestoreModRef;
  let done = 0;
  for (const file of files) {
    if (progressEl) progressEl.textContent = `${team} 인증샷 올리는 중… (${done + 1}/${files.length})`;
    try {
      let dataUrl = await compressImageToDataUrl(file, 1280, 0.7);
      if (dataUrl.length > 900000) dataUrl = await compressImageToDataUrl(file, 900, 0.55);
      if (dataUrl.length > 900000) throw new Error('too large even after compression');
      await addDoc(collection(db, 'gbs_photos'), {
        url: dataUrl, missionId, missionTitle: mission.title, team, uploaderName: getNickname(), uploadedAt: serverTimestamp(),
      });
      done++;
    } catch (err) {
      console.error('gbs photo upload failed', err);
      toast('사진이 너무 커서 일부 업로드에 실패했어요.');
    }
  }
  if (progressEl) {
    progressEl.textContent = `${done}장 업로드 완료!`;
    setTimeout(() => { progressEl.hidden = true; }, 2000);
  }
  fileInput.value = '';
  if (done > 0) toast(`${team} '${mission.title}' 인증 완료! 🙌`);
});

// 초성 퀴즈: 엔터로 정답 확인
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'qzInput' && qz) {
    e.preventDefault();
    const btn = document.querySelector('[data-qz-check]');
    if (btn) btn.click();
  }
});

/* ============================================================================
   BOOT
============================================================================ */
renderAll();
updateGbsDynamic();
document.getElementById('adminGearBtn').classList.toggle('on', isAdminUnlocked());
initFirebase();
</script>
