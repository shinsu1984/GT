<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GT 겨울여정</title>
<meta name="description" content="2027 GT 교사 겨울수련회 정보 안내 앱 — 일정, 분과, 미션, 정보, 사진을 한 곳에서 확인하세요.">
<meta name="theme-color" content="#3562e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GT 겨울여정">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233562e8'/%3E%3Ccircle cx='12' cy='12' r='7.2' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='M14.6 9.4l-1.6 4.2-4.2 1.6 1.6-4.2z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef1f8;
  --border:#e4e7f0; --border-strong:#cfd5e6;
  --ink:#1c2333; --ink-dim:#5c6478; --ink-faint:#96a0b5;
  --primary:#3562e8; --primary-soft:#eaf0ff; --primary-line:#c6d6ff;
  --violet:#7c5cff; --violet-soft:#efeaff; --violet-line:#d9ccff;
  --amber:#e8890c; --amber-soft:#fff4e0; --amber-line:#f6d99a;
  --coral:#e0433a; --coral-soft:#fdeceb; --coral-line:#f6c6c2;
  --mint:#0d9868; --mint-soft:#e2f7ee; --mint-line:#a9e6cb;
  --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
img{max-width:100%;}
a{color:inherit;}
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.15em;flex:none;}

.app-shell{max-width:520px;margin:0 auto;position:relative;min-height:100%;background:var(--bg);padding-bottom:96px;}

.sample-banner{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px 16px;background:var(--amber-soft);color:#8a5a05;border-bottom:1px solid var(--amber-line);font-size:12px;text-align:center;}
.sample-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:11px;}
.sample-banner button{background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit;padding:0;flex:none;font-weight:700;}

.topbar{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar-title{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;}
.topbar-title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);}
.topbar-dday{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-line);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums;}

main{padding:16px 18px 8px;}

.home-banner{background:linear-gradient(160deg,var(--primary) 0%,#2748b8 100%);color:#fff;border-radius:var(--radius-l);padding:22px 20px;margin-bottom:18px;position:relative;overflow:hidden;}
.home-banner::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);}
.home-eyebrow{font-size:11px;letter-spacing:.16em;opacity:.8;font-weight:700;}
.home-title{font-size:23px;margin-top:8px;color:#fff;}
.home-year{color:#ffd67a;}
.home-theme{margin-top:8px;font-size:13.5px;opacity:.92;max-width:38ch;}
.home-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px;}
.home-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;}
.home-dday-row{display:flex;align-items:center;gap:10px;margin-top:16px;}
.home-dday{font-family:var(--font-mono);font-weight:800;font-size:15px;background:rgba(255,255,255,.94);color:var(--primary);padding:7px 14px;border-radius:999px;font-variant-numeric:tabular-nums;}

.home-welcome{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;margin-bottom:18px;color:var(--ink-dim);font-size:14px;white-space:pre-line;}

.section-label{font-size:12.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.02em;margin-bottom:10px;}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.quick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--ink);}
.quick-card .icon-badge{width:32px;height:32px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;}
.quick-card b{font-size:13.5px;font-weight:700;}

.notice-preview-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;}
.notice-preview-card.important{border-color:var(--coral-line);background:var(--coral-soft);}
.notice-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);margin-top:6px;flex:none;}
.notice-preview-card.important .notice-dot{background:var(--coral);}
.notice-preview-text b{font-size:13.5px;font-weight:700;display:block;}
.notice-preview-text span{font-size:12.5px;color:var(--ink-dim);}
.see-all-link{display:flex;align-items:center;gap:5px;color:var(--primary);font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:14px;}

.mission-teaser{background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:var(--radius-m);padding:14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;}
.mission-teaser .icon-badge{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--violet);display:flex;align-items:center;justify-content:center;flex:none;}
.mission-teaser b{font-size:13.5px;color:var(--ink);display:block;}
.mission-teaser span{font-size:12px;color:var(--ink-dim);}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

.stop{margin-bottom:22px;}
.stop-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.stop-badge{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--primary);font-size:16px;}
.stop-title{font-size:16.5px;color:var(--ink);flex:1;}
.stop-sub{font-size:12.5px;color:var(--ink-faint);margin:-10px 0 14px 45px;}

.venue-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:16px;}
.venue-name{font-size:15.5px;color:var(--ink);font-weight:700;}
.venue-addr{color:var(--ink-dim);font-size:13px;margin-top:5px;}
.venue-link{display:inline-flex;align-items:center;gap:6px;margin-top:11px;color:var(--primary);font-size:13px;text-decoration:none;font-weight:700;}
.transport-list{margin-top:15px;display:flex;flex-direction:column;gap:10px;}
.transport-item{display:flex;gap:12px;border-top:1px solid var(--border);padding-top:10px;}
.transport-item:first-child{border-top:none;padding-top:0;}
.transport-method{flex:none;width:74px;font-size:12px;color:var(--primary);font-weight:700;}
.transport-desc{color:var(--ink-dim);font-size:13px;flex:1;}

.day-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.day-tab{background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-dim);padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:600;}
.day-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.day-panel{display:none;}
.day-panel.active{display:block;}
.timeline{position:relative;padding-left:19px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border-strong);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);}
.tl-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.tl-time{font-family:var(--font-mono);color:var(--primary);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;}
.tl-title{color:var(--ink);font-weight:700;font-size:14px;}
.tl-tag{font-size:10.5px;padding:2px 8px;border-radius:999px;margin-left:auto;font-weight:700;}
.tl-tag.tag-primary{background:var(--primary-soft);color:var(--primary);}
.tl-tag.tag-violet{background:var(--violet-soft);color:var(--violet);}
.tl-tag.tag-amber{background:var(--amber-soft);color:var(--amber);}
.tl-tag.tag-mint{background:var(--mint-soft);color:var(--mint);}
.tl-tag.tag-grey{background:var(--surface-2);color:var(--ink-faint);}
.tl-desc{color:var(--ink-dim);font-size:12.5px;margin-top:3px;}

/* workshops (분과·워크숍) */
.round-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:15px;margin-bottom:10px;}
.session-top{display:flex;align-items:baseline;gap:9px;}
.session-time{font-family:var(--font-mono);color:var(--violet);font-size:12px;font-weight:700;flex:none;}
.session-title{font-size:14.5px;font-weight:700;color:var(--ink);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.session-meta span{font-size:11px;color:var(--ink-faint);background:var(--surface-2);padding:2px 8px;border-radius:999px;font-weight:600;}
.session-desc{margin-top:8px;font-size:12.5px;color:var(--ink-dim);}

/* missions */
.mission-progress{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;margin-bottom:18px;}
.mission-progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.mission-progress-top b{font-size:14px;color:var(--ink);}
.mission-progress-top span{font-family:var(--font-mono);font-size:13px;color:var(--violet);font-weight:700;}
.mission-bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.mission-bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--primary));border-radius:999px;transition:width .3s ease;}
.mission-cat-label{font-size:12px;font-weight:800;color:var(--violet);margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
.mission-list{display:flex;flex-direction:column;gap:8px;}
.mission-card{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:13px;cursor:pointer;}
.mission-card.done{background:var(--mint-soft);border-color:var(--mint-line);}
.mission-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;}
.mission-check.checked{background:var(--mint);border-color:var(--mint);}
.mission-check .icon{width:12px;height:12px;}
.mission-text{font-size:13.5px;color:var(--ink);}
.mission-card.done .mission-text{color:var(--ink-dim);text-decoration:line-through;}
.commitment-card{background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:var(--radius-l);padding:16px;margin-bottom:20px;}
.commitment-card b{font-size:14px;color:var(--ink);display:block;margin-bottom:8px;}
.commitment-card textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid var(--border-strong);padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical;background:#fff;}
.commitment-save{margin-top:8px;background:var(--violet);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
.commitment-saved{margin-top:10px;font-size:12.5px;color:var(--ink-dim);font-style:italic;}

/* group / packing */
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.group-name{color:var(--primary);font-weight:800;font-size:14.5px;}
.group-row{display:flex;gap:6px;font-size:12.5px;color:var(--ink-dim);margin-top:7px;}
.group-row b{color:var(--ink);font-weight:700;min-width:44px;flex:none;}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.pack-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.pack-title{font-size:13.5px;color:var(--ink);font-weight:800;}
.pack-list{list-style:none;margin:11px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.pack-list li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-dim);}
.pack-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.pack-check.checked{background:var(--mint);border-color:var(--mint);}
.pack-check .icon{width:11px;height:11px;}
.pack-text.checked{color:var(--ink-faint);text-decoration:line-through;}

/* notice / faq */
.notice-list{display:flex;flex-direction:column;gap:10px;}
.notice-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.notice-card.important{border-color:var(--coral-line);background:var(--coral-soft);}
.notice-top{display:flex;align-items:center;gap:8px;}
.notice-title{font-weight:700;color:var(--ink);font-size:14px;flex:1;}
.badge-important{font-size:10.5px;color:var(--coral);border:1px solid var(--coral-line);padding:2px 8px;border-radius:999px;flex:none;font-weight:700;}
.notice-body{color:var(--ink-dim);font-size:13px;margin-top:7px;white-space:pre-line;}
.faq-list{display:flex;flex-direction:column;gap:8px;}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.faq-q{width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:13px 14px;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;}
.faq-q .icon{margin-left:auto;transition:transform .2s;flex:none;color:var(--ink-faint);}
.faq-item.open .faq-q .icon{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.faq-item.open .faq-a{max-height:400px;}
.faq-a-inner{padding:0 14px 14px;color:var(--ink-dim);font-size:13px;}

/* contact */
.contact-list{display:flex;flex-direction:column;gap:9px;}
.contact-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;display:flex;align-items:center;gap:12px;}
.contact-info{flex:1;}
.contact-role{font-size:11px;color:var(--ink-faint);font-weight:600;}
.contact-name{font-size:14px;color:var(--ink);font-weight:700;margin-top:2px;}
.contact-phone{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-size:12.5px;font-family:var(--font-mono);margin-top:2px;font-weight:700;}

.empty-note{color:var(--ink-faint);font-size:13px;font-style:italic;}

/* photos */
.photo-upload-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:16px;margin-bottom:18px;}
.photo-upload-card .field{margin-bottom:12px;}
.photo-upload-card label.f-label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-weight:600;}
.photo-upload-card input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;}
.file-drop{border:1.5px dashed var(--border-strong);border-radius:var(--radius-m);padding:20px;text-align:center;color:var(--ink-faint);font-size:13px;cursor:pointer;background:var(--surface-2);}
.file-drop input{display:none;}
.file-drop.has-files{color:var(--primary);border-color:var(--primary-line);background:var(--primary-soft);}
.upload-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}
.upload-btn:disabled{opacity:.5;cursor:not-allowed;}
.upload-progress{margin-top:10px;font-size:12.5px;color:var(--ink-dim);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.photo-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;position:relative;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .photo-name{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);color:#fff;font-size:9.5px;font-weight:600;}
.firebase-setup-note{background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius-m);padding:18px;color:var(--ink-dim);font-size:13px;text-align:center;}
.firebase-setup-note b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px;}

.lightbox{position:fixed;inset:0;z-index:90;background:rgba(10,14,26,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;object-fit:contain;}
.lightbox-caption{color:#fff;font-size:13px;margin-top:14px;text-align:center;opacity:.85;}
.lightbox-close{position:absolute;top:20px;right:20px;top:calc(20px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;box-shadow:0 -6px 24px -12px rgba(20,30,60,.18);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;background:none;border:none;color:var(--ink-faint);font-size:10px;font-weight:700;cursor:pointer;}
.tab-btn .icon{width:20px;height:20px;}
.tab-btn.active{color:var(--primary);}

.toast{position:fixed;left:50%;bottom:88px;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:80;max-width:88vw;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);}
[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="app-shell" id="page">
  <div class="sample-banner" id="sampleBanner">
    🚧 예시 데이터로 채운 뼈대 버전 — 이 파일 위쪽 <code>RETREAT_DATA</code> 부분에서 실제 정보로 바꿔주세요.
    <button type="button" id="dismissBanner">닫기</button>
  </div>

  <header class="topbar">
    <div class="topbar-title"><span class="dot"></span><span id="topbarTitle">GT 겨울여정</span></div>
    <div class="topbar-dday" id="ddayBadge">D-000</div>
  </header>

  <main id="content"></main>

  <nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="닫기">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lightboxImg" alt="">

============================================================================ */
function computeDday() {
  const m = RETREAT_DATA.meta;
  if (!m.dateStart) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(m.dateStart + 'T00:00:00');
  const diff = Math.round((start - today) / 86400000);
  if (diff > 0) return 'D-' + diff;
  if (diff === 0) return 'D-DAY';
  return '여정 종료';
}
function renderTopbar() {
  document.getElementById('topbarTitle').textContent = (RETREAT_DATA.meta.orgName || 'GT') + ' 겨울여정';
  document.getElementById('ddayBadge').textContent = computeDday();
}

let firebaseApp = null, db = null, storage = null;
const uploaderKey = 'gt_uploader_name';

function renderPhotosShell() {
  if (!isFirebaseConfigured()) {
    return `<div class="stop">
      <div class="stop-head"><div class="stop-badge">${iconSvg('camera')}</div><h2 class="stop-title">사진</h2></div>
      <div class="firebase-setup-note">
        <b>사진 공유 기능을 켜려면 Firebase 설정이 필요해요</b>
        이 파일 위쪽 <code>firebaseConfig</code> 값을 채워주세요.<br>자세한 방법은 README.md를 참고하세요.
      </div>
    </div>`;
  }
  return `<div class="stop">
    <div class="stop-head"><div class="stop-badge">${iconSvg('camera')}</div><h2 class="stop-title">사진</h2></div>
    <div class="photo-upload-card">
      <div class="field"><label class="f-label" for="uploaderName">이름 (선택)</label><input type="text" id="uploaderName" placeholder="예: 김선생"></div>
      <label class="file-drop" id="fileDrop">
        <span id="fileDropText">${iconSvg('upload')} 눌러서 사진 선택 (여러 장 가능)</span>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button type="button" class="upload-btn" id="uploadBtn" disabled>사진 업로드</button>
      <div class="upload-progress" id="uploadProgress" hidden></div>
    </div>
    <div class="section-label">공유된 사진</div>
    <div class="photo-grid" id="photoGrid"><p class="empty-note">불러오는 중…</p></div>
  </div>`;
}
async function initFirebase() {
  if (!isFirebaseConfigured()) return;
  try {
    const [{ initializeApp }, firestoreMod, storageMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js'),
    ]);
    firebaseApp = initializeApp(firebaseConfig);
    db = firestoreMod.getFirestore(firebaseApp);
    storage = storageMod.getStorage(firebaseApp);
    watchPhotos(firestoreMod);
    setupUploadUI(storageMod, firestoreMod);
  } catch (err) {
    console.error('Firebase init failed', err);
    const grid = document.getElementById('photoGrid');
    if (grid) grid.innerHTML = '<p class="empty-note">사진을 불러오지 못했어요. firebaseConfig 값을 확인해주세요.</p>';
  }
}
function watchPhotos(firestoreMod) {
  const { collection, query, orderBy, limit, onSnapshot } = firestoreMod;
  const q = query(collection(db, 'photos'), orderBy('uploadedAt', 'desc'), limit(120));
  onSnapshot(q, (snap) => {
    const grid = document.getElementById('photoGrid');
    if (!grid) return;
    if (snap.empty) { grid.innerHTML = '<p class="empty-note">아직 업로드된 사진이 없어요. 첫 사진을 올려보세요!</p>'; return; }
    grid.innerHTML = snap.docs.map((d) => {
      const p = d.data();
      return `<div class="photo-thumb" data-url="${esc(p.url)}" data-name="${esc(p.name || '')}">
        <img src="${esc(p.url)}" loading="lazy" alt="${esc(p.name || '공유 사진')}">
        ${p.name ? `<span class="photo-name">${esc(p.name)}</span>` : ''}
      </div>`;
    }).join('');
  }, (err) => {
    console.error('photo watch failed', err);
    const grid = document.getElementById('photoGrid');
    if (grid) grid.innerHTML = '<p class="empty-note">사진을 불러오지 못했어요. Firestore 보안 규칙을 확인해주세요.</p>';
  });
}
function setupUploadUI(storageMod, firestoreMod) {
  const nameInput = document.getElementById('uploaderName');
  const fileInput = document.getElementById('fileInput');
  const fileDrop = document.getElementById('fileDrop');
  const fileDropText = document.getElementById('fileDropText');
  const uploadBtn = document.getElementById('uploadBtn');
  const progressEl = document.getElementById('uploadProgress');
  if (!fileInput) return;

  nameInput.value = lsGet(uploaderKey, '');
  nameInput.addEventListener('input', () => lsSet(uploaderKey, nameInput.value));

  fileInput.addEventListener('change', () => {
    const n = fileInput.files.length;
    fileDrop.classList.toggle('has-files', n > 0);
    fileDropText.textContent = n > 0 ? `${n}장 선택됨 · 다시 눌러 변경` : '눌러서 사진 선택 (여러 장 가능)';
    uploadBtn.disabled = n === 0;
  });

  uploadBtn.addEventListener('click', async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;
    uploadBtn.disabled = true;
    progressEl.hidden = false;
    const { ref, uploadBytes, getDownloadURL } = storageMod;
    const { collection, addDoc, serverTimestamp } = firestoreMod;
    const name = nameInput.value.trim();
    let done = 0;
    for (const file of files) {
      progressEl.textContent = `업로드 중… (${done + 1}/${files.length})`;
      try {
        const path = `photos/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${file.name}`;
        const sref = ref(storage, path);
        await uploadBytes(sref, file);
        const url = await getDownloadURL(sref);
        await addDoc(collection(db, 'photos'), { url, name: name || '', path, uploadedAt: serverTimestamp() });
        done++;
      } catch (err) {
        console.error('upload failed', err);
        toast('일부 사진 업로드에 실패했어요.');
      }
    }
    progressEl.textContent = `${done}장 업로드 완료!`;
    setTimeout(() => { progressEl.hidden = true; }, 2000);
    fileInput.value = '';
    fileDrop.classList.remove('has-files');
    fileDropText.textContent = '눌러서 사진 선택 (여러 장 가능)';
    uploadBtn.disabled = true;
    if (done > 0) toast(`사진 ${done}장을 공유했어요!`);
  });
}

/* ============================================================================
   GLOBAL CLICK / INPUT DELEGATION
============================================================================ */
document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('.tab-btn[data-tab]');
  if (tabBtn) { switchTab(tabBtn.getAttribute('data-tab')); return; }

  const gotoTab = e.target.closest('[data-goto-tab]');
  if (gotoTab) { switchTab(gotoTab.getAttribute('data-goto-tab')); return; }

  const dayTab = e.target.closest('.day-tab[data-day]');
  if (dayTab) {
    const panel = dayTab.closest('.tab-panel');
    panel.querySelectorAll('.day-tab').forEach((t) => t.classList.remove('active'));
    dayTab.classList.add('active');
    panel.querySelectorAll('.day-panel').forEach((p) => p.classList.remove('active'));
    const dp = panel.querySelector(`[data-day-panel="${dayTab.getAttribute('data-day')}"]`);
    if (dp) dp.classList.add('active');
    return;
  }
  const roundTab = e.target.closest('.day-tab[data-round]');
  if (roundTab) {
    const panel = roundTab.closest('.tab-panel');
    panel.querySelectorAll('.day-tab').forEach((t) => t.classList.remove('active'));
    roundTab.classList.add('active');
    panel.querySelectorAll('.day-panel').forEach((p) => p.classList.remove('active'));
    const dp = panel.querySelector(`[data-round-panel="${roundTab.getAttribute('data-round')}"]`);
    if (dp) dp.classList.add('active');
    return;
  }

  const faqQ = e.target.closest('[data-faq-toggle]');
  if (faqQ) { faqQ.closest('.faq-item').classList.toggle('open'); return; }

  const packToggle = e.target.closest('[data-pack-toggle]');
  if (packToggle) {
    const key = packToggle.getAttribute('data-pack-toggle');
    const now = !lsGet(key, false);
    lsSet(key, now);
    packToggle.classList.toggle('checked', now);
    packToggle.innerHTML = now ? iconSvg('check') : '';
    const textEl = document.querySelector(`[data-pack-text="${key}"]`);
    if (textEl) textEl.classList.toggle('checked', now);
    return;
  }

  const missionToggle = e.target.closest('[data-mission-toggle]');
  if (missionToggle) {
    const key = missionToggle.getAttribute('data-mission-toggle');
    const now = !lsGet(key, false);
    lsSet(key, now);
    missionToggle.classList.toggle('done', now);
    const cb = missionToggle.querySelector('.mission-check');
    cb.classList.toggle('checked', now);
    cb.innerHTML = now ? iconSvg('check') : '';
    const stats = missionStats();
    const bar = document.querySelector('.mission-bar-fill');
    const label = document.querySelector('.mission-progress-top span');
    if (bar) bar.style.width = (stats.total ? Math.round((stats.done / stats.total) * 100) : 0) + '%';
    if (label) label.textContent = `${stats.done} / ${stats.total}`;
    return;
  }

  if (e.target.id === 'commitmentSave') {
    const val = document.getElementById('commitmentInput').value.trim();
    lsSet('gt_my_commitment', val);
    const saved = document.getElementById('commitmentSaved');
    saved.hidden = false;
    saved.textContent = val ? '저장됐어요. 언제든 다시 고쳐 쓸 수 있어요.' : '다짐을 지웠어요.';
    toast('저장했어요.');
    return;
  }

  const thumb = e.target.closest('.photo-thumb');
  if (thumb) { openLightbox(thumb.getAttribute('data-url'), thumb.getAttribute('data-name')); return; }
});

document.getElementById('dismissBanner').addEventListener('click', () => { document.getElementById('sampleBanner').hidden = true; });

/* ============================================================================
   BOOT
============================================================================ */
renderAll();
initFirebase();
</script>
</body>
</html>
