<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GT 겨울여정</title>
<meta name="description" content="2027 GT 교사 겨울수련회 정보 안내 앱 — 일정, 미션, 사진, GBS, 각종 안내를 한 곳에서 확인하세요.">
<meta name="theme-color" content="#3562e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GT 겨울여정">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233562e8'/%3E%3Ccircle cx='12' cy='12' r='7.2' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='M14.6 9.4l-1.6 4.2-4.2 1.6 1.6-4.2z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef1f8;
  --border:#e4e7f0; --border-strong:#cfd5e6;
  --ink:#1c2333; --ink-dim:#5c6478; --ink-faint:#96a0b5;
  --primary:#3562e8; --primary-soft:#eaf0ff; --primary-line:#c6d6ff;
  --violet:#7c5cff; --violet-soft:#efeaff; --violet-line:#d9ccff;
  --amber:#e8890c; --amber-soft:#fff4e0; --amber-line:#f6d99a;
  --coral:#e0433a; --coral-soft:#fdeceb; --coral-line:#f6c6c2;
  --mint:#0d9868; --mint-soft:#e2f7ee; --mint-line:#a9e6cb;
  --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --shadow-card:0 1px 2px rgba(20,30,70,.04), 0 6px 18px -8px rgba(20,30,70,.12);
  --shadow-card-hover:0 2px 4px rgba(20,30,70,.05), 0 10px 26px -8px rgba(20,30,70,.16);
  --shadow-pop:0 8px 30px -6px rgba(20,30,70,.22);
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:linear-gradient(180deg,#eef1fb 0%,#f5f6fa 340px,#f5f6fa 100%);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
h1,h2,h3{font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.02em;}
p{margin:0;}
button{font-family:inherit;}
img{max-width:100%;}
a{color:inherit;}
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.15em;flex:none;}

.app-shell{max-width:520px;margin:0 auto;position:relative;min-height:100%;background:transparent;padding-bottom:96px;}

/* 카드형 요소 공통 입체감 */
.venue-card,.group-card,.pack-card,.notice-card,.faq-item,.contact-card,.session-card,
.mission-card,.link-card,.quick-card,.rank-board,.nickname-card,.commitment-card,
.photo-upload-card,.prayer-form,.prayer-post,.menu-tile,.home-welcome,.mission-progress,
.step-item,.meal-day,.roster-row,.firebase-setup-note,.map-frame,.admin-field,.notice-preview-card,
.mission-teaser{
  box-shadow:var(--shadow-card);
  transition:box-shadow .18s ease, transform .18s ease;
}

.topbar{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar-title{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.admin-gear{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.65;}
.admin-gear.on{background:var(--mint-soft);opacity:1;}
.topbar-dday{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-line);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums;}

main{padding:16px 18px 8px;}

.home-banner{background:linear-gradient(155deg,#4a72f2 0%,var(--primary) 45%,#1f3aa0 100%);color:#fff;border-radius:var(--radius-l);padding:24px 22px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 16px 40px -14px rgba(31,58,160,.5);}
.home-banner::after{content:'';position:absolute;right:-50px;top:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);}
.home-banner::before{content:'';position:absolute;left:-30px;bottom:-60px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,214,122,.18),transparent 70%);}
.home-cross{position:absolute;right:22px;top:22px;width:30px;height:30px;opacity:.28;pointer-events:none;}
.home-eyebrow{font-size:11px;letter-spacing:.18em;opacity:.85;font-weight:700;}
.home-title{font-size:23px;margin-top:9px;color:#fff;position:relative;}
.home-year{color:#ffd67a;}
.home-theme{margin-top:9px;font-size:13.5px;opacity:.95;max-width:38ch;position:relative;}
.home-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px;position:relative;}
.home-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;backdrop-filter:blur(6px);}
.home-dday-row{display:flex;align-items:center;gap:10px;margin-top:17px;position:relative;}
.home-dday{font-family:var(--font-mono);font-weight:800;font-size:15px;background:rgba(255,255,255,.96);color:var(--primary);padding:7px 14px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px -4px rgba(0,0,0,.25);}

.home-welcome{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:17px;margin-bottom:18px;color:var(--ink-dim);font-size:14px;white-space:pre-line;}

.section-label{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:.02em;margin-bottom:11px;padding-left:10px;position:relative;}
.section-label::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--violet));}
.section-label.gold::before{background:linear-gradient(180deg,#f0a623,var(--amber));}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.quick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--ink);}
.quick-card .icon-badge{width:32px;height:32px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:17px;}
.quick-card b{font-size:13.5px;font-weight:700;}

.notice-preview-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;}
.notice-preview-card.important{border-color:var(--coral-line);background:var(--coral-soft);}
.notice-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);margin-top:6px;flex:none;}
.notice-preview-card.important .notice-dot{background:var(--coral);}
.notice-preview-text b{font-size:13.5px;font-weight:700;display:block;}
.notice-preview-text span{font-size:12.5px;color:var(--ink-dim);}
.see-all-link{display:flex;align-items:center;gap:5px;color:var(--primary);font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:14px;}

.mission-teaser{background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:var(--radius-m);padding:14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;}
.mission-teaser .icon-badge{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px;}
.mission-teaser b{font-size:13.5px;color:var(--ink);display:block;}
.mission-teaser span{font-size:12px;color:var(--ink-dim);}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

.stop{margin-bottom:22px;}
.stop-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.stop-badge{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);border:1px solid var(--primary-line);font-size:17px;}
.stop-title{font-size:16.5px;color:var(--ink);flex:1;}
.stop-sub{font-size:12.5px;color:var(--ink-faint);margin:-10px 0 14px 45px;}

.venue-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:16px;}
.venue-name{font-size:15.5px;color:var(--ink);font-weight:700;}
.venue-addr{color:var(--ink-dim);font-size:13px;margin-top:5px;}
.venue-link{display:inline-flex;align-items:center;gap:6px;margin-top:11px;color:var(--primary);font-size:13px;text-decoration:none;font-weight:700;}
.transport-list{margin-top:15px;display:flex;flex-direction:column;gap:10px;}
.transport-item{display:flex;gap:12px;border-top:1px solid var(--border);padding-top:10px;}
.transport-item:first-child{border-top:none;padding-top:0;}
.transport-method{flex:none;width:74px;font-size:12px;color:var(--primary);font-weight:700;}
.transport-desc{color:var(--ink-dim);font-size:13px;flex:1;}

.day-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.day-tab{background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-dim);padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:600;}
.day-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.day-panel{display:none;}
.day-panel.active{display:block;}
.timeline{position:relative;padding-left:19px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border-strong);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);}
.tl-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.tl-time{font-family:var(--font-mono);color:var(--primary);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;}
.tl-title{color:var(--ink);font-weight:700;font-size:14px;}
.tl-tag{font-size:10.5px;padding:2px 8px;border-radius:999px;margin-left:auto;font-weight:700;}
.tl-tag.tag-primary{background:var(--primary-soft);color:var(--primary);}
.tl-tag.tag-violet{background:var(--violet-soft);color:var(--violet);}
.tl-tag.tag-amber{background:var(--amber-soft);color:var(--amber);}
.tl-tag.tag-mint{background:var(--mint-soft);color:var(--mint);}
.tl-tag.tag-grey{background:var(--surface-2);color:var(--ink-faint);}
.tl-desc{color:var(--ink-dim);font-size:12.5px;margin-top:3px;}

/* workshops */
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:15px;margin-bottom:10px;}
.session-top{display:flex;align-items:baseline;gap:9px;}
.session-time{font-family:var(--font-mono);color:var(--violet);font-size:12px;font-weight:700;flex:none;}
.session-title{font-size:14.5px;font-weight:700;color:var(--ink);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.session-meta span{font-size:11px;color:var(--ink-faint);background:var(--surface-2);padding:2px 8px;border-radius:999px;font-weight:600;}
.session-desc{margin-top:8px;font-size:12.5px;color:var(--ink-dim);}
.oly-card{border-left:3px solid var(--amber);}
.oly-card .session-top .session-time{font-size:19px;color:inherit;}
.oly-card .session-meta span{color:#8a5a05;background:var(--amber-soft);}

/* missions */
.mission-progress{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;margin-bottom:18px;}
.mission-progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.mission-progress-top b{font-size:14px;color:var(--ink);}
.mission-progress-top span{font-family:var(--font-mono);font-size:13px;color:var(--violet);font-weight:700;}
.mission-bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.mission-bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--primary));border-radius:999px;transition:width .3s ease;}
.mission-cat-label{font-size:12.5px;font-weight:800;color:var(--violet);margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
.mission-cat-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;margin-bottom:8px;}
.mission-cat-item.full{border-color:var(--mint-line);}
.mission-cat-head{width:100%;background:none;border:none;padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;}
.mission-cat-emoji{font-size:18px;flex:none;}
.mission-cat-name{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);}
.mission-cat-count{font-family:var(--font-mono);font-size:11.5px;color:var(--violet);font-weight:700;background:var(--violet-soft);padding:3px 9px;border-radius:999px;flex:none;}
.mission-cat-item.full .mission-cat-count{color:var(--mint);background:var(--mint-soft);}
.mission-cat-head .icon{color:var(--ink-faint);transition:transform .2s;flex:none;}
.mission-cat-item.open .mission-cat-head .icon{transform:rotate(180deg);}
.mission-cat-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.mission-cat-item.open .mission-cat-body{max-height:3000px;}
.mission-cat-body .mission-list{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;}
.mission-cat-body .mission-card{box-shadow:none;}
.mission-list{display:flex;flex-direction:column;gap:8px;}
.mission-card{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:13px;cursor:pointer;}
.mission-card.done{background:var(--mint-soft);border-color:var(--mint-line);}
.mission-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;}
.mission-check.checked{background:var(--mint);border-color:var(--mint);}
.mission-check .icon{width:12px;height:12px;}
.mission-text{font-size:13.5px;color:var(--ink);}
.mission-card.done .mission-text{color:var(--ink-dim);text-decoration:line-through;}
.commitment-card{background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:var(--radius-l);padding:16px;margin-bottom:20px;}
.commitment-card b{font-size:14px;color:var(--ink);display:block;margin-bottom:2px;}
.commitment-hint{display:block;font-size:11.5px;color:var(--ink-dim);margin:0 0 10px;}
.commitment-card textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid var(--border-strong);padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical;background:#fff;}
.commitment-save{margin-top:8px;background:linear-gradient(135deg,var(--violet),#6a4ae8);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px -6px rgba(124,92,255,.55);}
.commitment-saved{margin-top:10px;font-size:12.5px;color:var(--ink-dim);font-style:italic;}
.commitment-post{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.commitment-post-name{font-size:12px;font-weight:800;color:var(--violet);}
.commitment-post-text{font-size:13.5px;color:var(--ink);margin-top:4px;white-space:pre-line;}

/* GBS 인증 미션 (사진으로 인증하는 특별 미션) */
.gbsphoto-section{background:linear-gradient(160deg,var(--amber-soft) 0%,#fffdf7 60%);border:1px solid var(--amber-line);border-radius:var(--radius-l);padding:16px 14px;margin-bottom:20px;box-shadow:var(--shadow-card);}
.gbsphoto-gbsname-field{margin-bottom:14px;}
.gbsphoto-gbsname-field .f-label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-weight:600;}
.gbsphoto-gbsname-field input{width:100%;background:#fff;border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;}
.gbsphoto-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-m);padding:13px;margin-bottom:10px;box-shadow:var(--shadow-card);}
.gbsphoto-card.done{border-color:var(--mint-line);background:var(--mint-soft);}
.gbsphoto-head{display:flex;align-items:flex-start;gap:10px;}
.gbsphoto-emoji{font-size:21px;flex:none;line-height:1.3;}
.gbsphoto-text{flex:1;min-width:0;}
.gbsphoto-text b{display:block;font-size:13.5px;color:var(--ink);}
.gbsphoto-text span{display:block;font-size:12px;color:var(--ink-dim);margin-top:3px;}
.gbsphoto-done-badge{display:none;flex:none;font-size:10.5px;font-weight:800;color:var(--mint);background:#fff;border:1px solid var(--mint-line);padding:3px 8px;border-radius:999px;white-space:nowrap;}
.gbsphoto-card.done .gbsphoto-done-badge{display:inline-flex;}
.gbsphoto-thumbs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px;}
.gbsphoto-thumbs .empty-note{white-space:nowrap;}
.gbsphoto-thumb{flex:none;width:46px;height:46px;border-radius:9px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;}
.gbsphoto-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.gbsphoto-upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#f0a623,var(--amber));color:#fff;border:none;border-radius:10px;padding:9px;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(232,137,12,.5);}
.gbsphoto-upload-btn .icon{width:14px;height:14px;}
.gbsphoto-progress{margin-top:8px;font-size:12px;color:var(--ink-dim);text-align:center;}

/* 닉네임 / 랭킹 */
.nickname-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;margin-bottom:16px;}
.nickname-card b{font-size:13.5px;color:var(--ink);display:block;margin-bottom:8px;}
.nickname-row{display:flex;gap:8px;}
.nickname-row input{flex:1;min-width:0;border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;background:var(--surface-2);}
.nickname-row button{background:linear-gradient(135deg,#4a72f2,var(--primary));color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;flex:none;box-shadow:0 6px 16px -6px rgba(53,98,232,.55);}
.nickname-current{font-size:12.5px;color:var(--ink-dim);margin-top:9px;}
.level-badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);border:1px solid var(--amber-line);color:#8a5a05;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;}

.rank-board{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:14px;margin-bottom:20px;}
.rank-board-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px;}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--border);}
.rank-row:first-child{border-top:none;}
.rank-row.me{background:var(--primary-soft);border-radius:10px;padding:9px 10px;}
.rank-num{width:26px;flex:none;text-align:center;font-weight:800;font-size:13px;color:var(--ink-faint);}
.rank-num.medal{font-size:17px;}
.rank-name{flex:1;font-size:13px;font-weight:700;color:var(--ink);}
.rank-pts{font-family:var(--font-mono);font-size:12.5px;color:var(--primary);font-weight:700;}

/* group / packing */
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.group-name{color:var(--primary);font-weight:800;font-size:14.5px;}
.group-row{display:flex;gap:6px;font-size:12.5px;color:var(--ink-dim);margin-top:7px;}
.group-row b{color:var(--ink);font-weight:700;min-width:44px;flex:none;}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.pack-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.pack-title{font-size:13.5px;color:var(--ink);font-weight:800;}

.pack-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.pack-check.checked{background:var(--mint);border-color:var(--mint);}
.pack-check .icon{width:11px;height:11px;}
.pack-text.checked{color:var(--ink-faint);text-decoration:line-through;}

/* notice / faq */
.notice-list{display:flex;flex-direction:column;gap:10px;}
.notice-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}

.notice-top{display:flex;align-items:center;gap:8px;}
.notice-title{font-weight:700;color:var(--ink);font-size:14px;flex:1;}
.badge-important{font-size:10.5px;color:var(--coral);border:1px solid var(--coral-line);padding:2px 8px;border-radius:999px;flex:none;font-weight:700;}
.notice-body{color:var(--ink-dim);font-size:13px;margin-top:7px;white-space:pre-line;}
.faq-list{display:flex;flex-direction:column;gap:8px;}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.faq-q{width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:13px 14px;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;}

.faq-item.open .faq-q .icon{transform:rotate(180deg);}

.faq-item.open .faq-a{max-height:400px;}
.faq-a-inner{padding:0 14px 14px;color:var(--ink-dim);font-size:13px;}

/* contact */
.contact-list{display:flex;flex-direction:column;gap:9px;}
.contact-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;display:flex;align-items:center;gap:12px;}
.contact-info{flex:1;}
.contact-role{font-size:11px;color:var(--ink-faint);font-weight:600;}
.contact-name{font-size:14px;color:var(--ink);font-weight:700;margin-top:2px;}
.contact-phone{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-size:12.5px;font-family:var(--font-mono);margin-top:2px;font-weight:700;}

.empty-note{color:var(--ink-faint);font-size:13px;font-style:italic;}

/* photos */

.file-drop.has-files{color:var(--primary);border-color:var(--primary-line);background:var(--primary-soft);}

.firebase-setup-note{background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius-m);padding:18px;color:var(--ink-dim);font-size:13px;text-align:center;}
.firebase-setup-note b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px;}

.lightbox-caption{color:#fff;font-size:13px;margin-top:14px;text-align:center;opacity:.85;}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;box-shadow:0 -8px 28px -14px rgba(20,30,60,.22);}

.toast{position:fixed;left:50%;bottom:88px;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:80;max-width:88vw;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);}

.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.menu-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;cursor:pointer;color:var(--ink);}

/* 안내 스텝 */
.step-list{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.step-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink-dim);}

/* 식단표 */

.meal-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}

.meal-row:first-of-type{border-top:none;}
.meal-type{width:46px;flex:none;font-weight:700;color:var(--ink);}

.roster-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;font-size:13px;}

.roster-row span{color:var(--ink-dim);}

.praise-title, .material-title{font-size:13.5px;font-weight:700;flex:1;}
.praise-item .icon, .material-item .icon{color:var(--ink-faint);}

.prayer-form input, .prayer-form textarea{width:100%;border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;margin-bottom:8px;background:var(--surface-2);}

.prayer-submit{background:linear-gradient(135deg,#ef5c50,var(--coral));color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(224,67,58,.5);}

.prayer-post-text{font-size:13.5px;color:var(--ink);margin-top:4px;white-space:pre-line;}

.admin-check-label{display:flex!important;align-items:center;gap:6px;width:auto!important;}
.admin-check-label input{width:auto!important;flex:none;}
.admin-save-btn{background:linear-gradient(135deg,var(--mint),#0b7d54);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(13,152,104,.5);}

.admin-del-btn{background:var(--coral-soft);color:var(--coral);border:1px solid var(--coral-line);border-radius:8px;width:34px;height:34px;flex:none;cursor:pointer;margin-top:2px;}
.admin-pin-row{display:flex;gap:8px;}
.admin-pin-row input{flex:1;}

/* 마을지도 */
.map-frame{background:var(--surface-2);border:1.5px dashed var(--border-strong);border-radius:var(--radius-l);padding:34px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
.map-frame img{border-radius:14px;margin-bottom:10px;}

</head>

============================================================================ */
function computeDday() {
  const m = RETREAT_DATA.meta;
  if (!m.dateStart) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(m.dateStart + 'T00:00:00');
  const diff = Math.round((start - today) / 86400000);
  if (diff > 0) return 'D-' + diff;
  if (diff === 0) return 'D-DAY';
  return '여정 종료';
}
function renderTopbar() {
  document.getElementById('topbarTitle').textContent = (RETREAT_DATA.meta.orgName || 'GT') + ' 겨울여정';
  document.getElementById('ddayBadge').textContent = computeDday();
}

   HOME TAB
============================================================================ */
function missionStats() {
  let total = 0, done = 0;
  RETREAT_DATA.missions.categories.forEach((cat) => {
    cat.items.forEach((_, idx) => {
      total++;
      if (lsGet('gt_mission_' + cat.id + '_' + idx, false)) done++;
    });
  });
  (RETREAT_DATA.missions.gbsPhotoMissions || []).forEach((m) => {
    total++;
    if (lsGet('gt_gbsphoto_done_' + m.id, false)) done++;
  });
  return { total, done };
}
function categoryStats(catId) {
  const cat = RETREAT_DATA.missions.categories.find((c) => c.id === catId);
  if (!cat) return { total: 0, done: 0 };
  let done = 0;
  cat.items.forEach((_, idx) => { if (lsGet('gt_mission_' + catId + '_' + idx, false)) done++; });
  return { total: cat.items.length, done };
}

  if (total > 0 && done >= total) return { emoji: '👑', label: '미션 마스터' };
  if (pct >= 0.5) return { emoji: '⭐', label: '미션 헌터' };

/* ============================================================================
   나의 다짐 — 저장하면 Firestore 'commitments'에 기록되어 모두에게 공유됩니다.
============================================================================ */
async function syncCommitment(text) {
  if (!isFirebaseConfigured() || !db || !firestoreModRef) return;
  const { doc, setDoc, deleteDoc, serverTimestamp } = firestoreModRef;
  const id = ensureDeviceId();
  try {
    if (text) {
      await setDoc(doc(db, 'commitments', id), { text, nickname: getNickname() || '이름없는 선생님', updatedAt: serverTimestamp() }, { merge: true });
    } else {
      await deleteDoc(doc(db, 'commitments', id));
    }
  } catch (err) { console.error('commitment sync failed', err); }
}
function watchCommitments(firestoreMod) {
  const { collection, query, orderBy, limit, onSnapshot } = firestoreMod;
  const q = query(collection(db, 'commitments'), orderBy('updatedAt', 'desc'), limit(60));
  onSnapshot(q, (snap) => {
    commitmentFeedCache = snap.empty
      ? '<p class="empty-note">아직 나눠진 다짐이 없어요. 첫 다짐을 나눠보세요!</p>'
      : snap.docs.map((d) => {
          const c = d.data();
          return `<div class="commitment-post"><div class="commitment-post-name">✍️ ${esc(c.nickname || '이름없는 선생님')}</div><div class="commitment-post-text">${esc(c.text)}</div></div>`;
        }).join('');
    const feed = document.getElementById('commitmentFeed');
    if (feed) feed.innerHTML = commitmentFeedCache;
  }, (err) => {
    console.error('commitment watch failed', err);
    commitmentFeedCache = '<p class="empty-note">불러오지 못했어요.</p>';
    const feed = document.getElementById('commitmentFeed');
    if (feed) feed.innerHTML = commitmentFeedCache;
  });
}

/* ============================================================================
   PHOTOS TAB (Firestore만 사용 — Firebase Storage/유료 요금제 불필요)
   사진은 브라우저에서 미리 리사이즈·압축한 뒤 base64로 Firestore 문서에 직접
   저장합니다. Firestore 문서는 1개당 1MB 한도가 있어서 그 안에 들어가도록
   압축하고, Firestore 무료 사용량(저장 1GB, 쓰기/읽기 일일 한도)으로 충분히
   커버돼요 — Storage처럼 결제수단 등록이 필요 없습니다.
============================================================================ */
let firebaseApp = null, db = null;
const PHOTO_FEATURES = [
  { key: 'all', label: '전체 사진', collection: 'photos', uploaderKey: 'gt_uploader_name' },
  { key: 'bible', label: '성경읽기 인증', collection: 'bible_photos', uploaderKey: 'gt_uploader_name_bible' },
];
function compressImageToDataUrl(file, maxDim, quality) {
  maxDim = maxDim || 1280; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function initFirebase() {
  if (!isFirebaseConfigured()) return;
  try {
    const [{ initializeApp }, firestoreMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
    ]);
    firebaseApp = initializeApp(firebaseConfig);
    db = firestoreMod.getFirestore(firebaseApp);
    firestoreModRef = firestoreMod;
    PHOTO_FEATURES.forEach((f) => {
      watchPhotos(f, firestoreMod);
      setupUploadUI(f, firestoreMod);
    });
    initPrayerBoard(firestoreMod);
    watchRanking();
    watchSettings(firestoreMod);
    watchCommitments(firestoreMod);
    watchGbsPhotoMissions(firestoreMod);
    syncMissionProgress();
  } catch (err) {
    console.error('Firebase init failed', err);
  }
}
function watchPhotos(f, firestoreMod) {
  const { collection, query, orderBy, limit, onSnapshot } = firestoreMod;
  const q = query(collection(db, f.collection), orderBy('uploadedAt', 'desc'), limit(120));
  onSnapshot(q, (snap) => {
    const html = snap.empty
      ? '<p class="empty-note">아직 업로드된 사진이 없어요. 첫 사진을 올려보세요!</p>'
      : snap.docs.map((d) => {
          const p = d.data();
          return `<div class="photo-thumb" data-url="${esc(p.url)}" data-name="${esc(p.name || '')}">
            <img src="${esc(p.url)}" loading="lazy" alt="${esc(p.name || '공유 사진')}">
            ${p.name ? `<span class="photo-name">${esc(p.name)}</span>` : ''}
          </div>`;
        }).join('');
    const gridIds = ['photoGrid_' + f.key];
    if (f.key === 'bible') { bibleGalleryCache = html; gridIds.push('bibleReadingPreviewGrid'); }
    gridIds.forEach((id) => { const el = document.getElementById(id); if (el) el.innerHTML = html; });
  }, (err) => {
    console.error('photo watch failed', err);
    const failNote = '<p class="empty-note">사진을 불러오지 못했어요. Firestore 보안 규칙을 확인해주세요.</p>';
    if (f.key === 'bible') bibleGalleryCache = failNote;
    const grid = document.getElementById('photoGrid_' + f.key);
    if (grid) grid.innerHTML = failNote;
  });
}
/* ============================================================================
   GBS 인증 미션 사진 (Firestore 'gbs_photos', missionId로 구분)
   — 하나의 컬렉션을 orderBy만으로 구독한 뒤 클라이언트에서 미션별로 묶어요.
   (where + orderBy를 같이 쓰면 Firestore 복합 색인이 필요해져서 일부러 피했어요.)
============================================================================ */
function watchGbsPhotoMissions(firestoreMod) {
  const { collection, query, orderBy, limit, onSnapshot } = firestoreMod;
  const q = query(collection(db, 'gbs_photos'), orderBy('uploadedAt', 'desc'), limit(400));
  onSnapshot(q, (snap) => {
    const byMission = {};
    snap.docs.forEach((d) => {
      const p = d.data();
      if (!p.missionId) return;
      (byMission[p.missionId] = byMission[p.missionId] || []).push(p);
    });
    gbsPhotoCache = byMission;
    renderAllGbsPhotoThumbs();
  }, (err) => console.error('gbs photo watch failed', err));
}
function setupUploadUI(f, firestoreMod) {
  const nameInput = document.getElementById('uploaderName_' + f.key);
  const fileInput = document.getElementById('fileInput_' + f.key);
  const fileDrop = document.getElementById('fileDrop_' + f.key);
  const fileDropText = document.getElementById('fileDropText_' + f.key);
  const uploadBtn = document.getElementById('uploadBtn_' + f.key);
  const progressEl = document.getElementById('uploadProgress_' + f.key);
  if (!fileInput) return;

  nameInput.value = lsGet(f.uploaderKey, '');
  nameInput.addEventListener('input', () => lsSet(f.uploaderKey, nameInput.value));

  fileInput.addEventListener('change', () => {
    const n = fileInput.files.length;
    fileDrop.classList.toggle('has-files', n > 0);
    fileDropText.textContent = n > 0 ? `${n}장 선택됨 · 다시 눌러 변경` : '눌러서 사진 선택 (여러 장 가능)';
    uploadBtn.disabled = n === 0;
  });

  uploadBtn.addEventListener('click', async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;
    uploadBtn.disabled = true;
    progressEl.hidden = false;
    const { collection, addDoc, serverTimestamp } = firestoreMod;
    const name = nameInput.value.trim();
    let done = 0;
    for (const file of files) {
      progressEl.textContent = `사진을 줄이는 중… (${done + 1}/${files.length})`;
      try {
        let dataUrl = await compressImageToDataUrl(file, 1280, 0.7);
        if (dataUrl.length > 900000) dataUrl = await compressImageToDataUrl(file, 900, 0.55);
        if (dataUrl.length > 900000) throw new Error('too large even after compression');
        progressEl.textContent = `업로드 중… (${done + 1}/${files.length})`;
        await addDoc(collection(db, f.collection), { url: dataUrl, name: name || '', uploadedAt: serverTimestamp() });
        done++;
      } catch (err) {
        console.error('upload failed', err);
        toast('사진이 너무 커서 일부 업로드에 실패했어요.');
      }
    }
    progressEl.textContent = `${done}장 업로드 완료!`;
    setTimeout(() => { progressEl.hidden = true; }, 2000);
    fileInput.value = '';
    fileDrop.classList.remove('has-files');
    fileDropText.textContent = '눌러서 사진 선택 (여러 장 가능)';
    uploadBtn.disabled = true;
    if (done > 0) toast(`사진 ${done}장을 공유했어요!`);
  });
}

async function saveAdminSettings() {
  const titleEls = document.querySelectorAll('[data-notice-title]');
  const notices = Array.from(titleEls).map((el) => {
    const i = el.getAttribute('data-notice-title');
    const bodyEl = document.querySelector(`[data-notice-body="${i}"]`);
    const impEl = document.querySelector(`[data-notice-important="${i}"]`);
    return { title: el.value.trim(), body: bodyEl ? bodyEl.value.trim() : '', important: !!(impEl && impEl.checked) };
  });
  RETREAT_DATA.notices = notices;

  document.querySelectorAll('[data-link-url]').forEach((el) => {
    const key = el.getAttribute('data-link-url');
    if (RETREAT_DATA.links[key]) RETREAT_DATA.links[key].url = el.value.trim();
  });

  RETREAT_DATA.meta.theme = (document.getElementById('adminTheme').value || '').trim();
  RETREAT_DATA.meta.welcome = document.getElementById('adminWelcome').value;
  RETREAT_DATA.meta.dateStart = (document.getElementById('adminDateStart').value || '').trim();
  RETREAT_DATA.meta.dateLabel = (document.getElementById('adminDateLabel').value || '').trim();

  if (!isFirebaseConfigured() || !db || !firestoreModRef) {
    toast('Firebase 설정이 없어서 이 기기에만 반영돼요.');
    refreshAfterSettingsChange();
    closeAdminModal();
    return;
  }
  const { doc, setDoc } = firestoreModRef;
  const linksPlain = {};
  Object.keys(RETREAT_DATA.links).forEach((k) => { linksPlain[k] = { url: RETREAT_DATA.links[k].url || '' }; });
  try {
    await setDoc(doc(db, 'settings', 'content'), {
      notices: RETREAT_DATA.notices,
      links: linksPlain,
      welcome: RETREAT_DATA.meta.welcome,
      theme: RETREAT_DATA.meta.theme,
      dateStart: RETREAT_DATA.meta.dateStart,
      dateLabel: RETREAT_DATA.meta.dateLabel,
    }, { merge: true });
    toast('저장했어요! 모두의 화면에 반영됩니다 🎉');
    refreshAfterSettingsChange();
    closeAdminModal();
  } catch (err) {
    console.error('admin save failed', err);
    toast('저장에 실패했어요. Firestore 규칙에 settings 컬렉션이 있는지 확인해주세요.');
  }
}
function refreshAfterSettingsChange() {
  renderTopbar();
  const homePanel = document.getElementById('panel-home');
  if (homePanel) homePanel.innerHTML = renderHome();
  const detailBody = document.getElementById('detailBody');
  if (detailBody) {

function watchSettings(firestoreMod) {
  const { doc, onSnapshot } = firestoreMod;
  onSnapshot(doc(db, 'settings', 'content'), (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    let changed = false;
    if (Array.isArray(data.notices)) { RETREAT_DATA.notices = data.notices; changed = true; }
    if (data.links && typeof data.links === 'object') {
      Object.keys(data.links).forEach((k) => { if (RETREAT_DATA.links[k]) Object.assign(RETREAT_DATA.links[k], data.links[k]); });
      changed = true;
    }
    if (typeof data.welcome === 'string') { RETREAT_DATA.meta.welcome = data.welcome; changed = true; }
    if (typeof data.theme === 'string') { RETREAT_DATA.meta.theme = data.theme; changed = true; }
    if (typeof data.dateStart === 'string' && data.dateStart) { RETREAT_DATA.meta.dateStart = data.dateStart; changed = true; }
    if (typeof data.dateLabel === 'string' && data.dateLabel) { RETREAT_DATA.meta.dateLabel = data.dateLabel; changed = true; }
    if (changed) refreshAfterSettingsChange();
  }, (err) => console.error('settings watch failed', err));
}

/* ============================================================================

document.addEventListener('change', async (e) => {
  const fileInput = e.target.closest('[data-gbsphoto-file]');

  const missionId = fileInput.getAttribute('data-gbsphoto-file');
  const mission = (RETREAT_DATA.missions.gbsPhotoMissions || []).find((m) => m.id === missionId);
  const files = Array.from(fileInput.files || []);
  if (!mission || !files.length) return;
  if (!isFirebaseConfigured() || !db || !firestoreModRef) {
    toast('Firebase 설정 후 인증샷을 올릴 수 있어요.');
    fileInput.value = '';

  const gbsNameInput = document.getElementById('myGbsNameInput');
  const gbsName = gbsNameInput ? gbsNameInput.value.trim() : '';

  const uploaderName = getNickname();
  const card = fileInput.closest('.gbsphoto-card');
  const progressEl = document.getElementById('gbsphotoProgress_' + missionId);
  if (progressEl) progressEl.hidden = false;
  const { collection, addDoc, serverTimestamp } = firestoreModRef;
  let done = 0;
  for (const file of files) {
    if (progressEl) progressEl.textContent = `업로드 중… (${done + 1}/${files.length})`;
    try {
      let dataUrl = await compressImageToDataUrl(file, 1280, 0.7);
      if (dataUrl.length > 900000) dataUrl = await compressImageToDataUrl(file, 900, 0.55);
      if (dataUrl.length > 900000) throw new Error('too large even after compression');
      await addDoc(collection(db, 'gbs_photos'), {
        url: dataUrl, missionId, missionTitle: mission.title, gbsName, uploaderName, uploadedAt: serverTimestamp(),
      });
      done++;
    } catch (err) {
      console.error('gbs photo upload failed', err);
      toast('사진이 너무 커서 일부 업로드에 실패했어요.');
    }
  }
  if (progressEl) {
    progressEl.textContent = `${done}장 업로드 완료!`;
    setTimeout(() => { progressEl.hidden = true; }, 2000);
  }
  fileInput.value = '';
  if (done > 0) {
    lsSet('gt_gbsphoto_done_' + missionId, true);
    if (card) {
      card.classList.add('done');
      const uploadLabel = card.querySelector('.gbsphoto-upload-btn');
      if (uploadLabel) uploadLabel.innerHTML = `${iconSvg('upload')} 사진 더 추가하기`;
    }
    const stats = missionStats();
    const bar = document.querySelector('.mission-bar-fill');
    const label = document.querySelector('.mission-progress-top span');
    if (bar) bar.style.width = (stats.total ? Math.round((stats.done / stats.total) * 100) : 0) + '%';
    if (label) label.textContent = `${stats.done} / ${stats.total}`;
    toast(`인증샷을 올렸어요! 🙌 (${done}장)`);
    syncMissionProgress();
  }
});

/* ============================================================================
   BOOT
============================================================================ */
renderAll();
document.getElementById('adminGearBtn').classList.toggle('on', isAdminUnlocked());
initFirebase();
</script>
</body>
</html>
